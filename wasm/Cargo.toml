[package]
name = "verusid-cmm-encrypt-wasm"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "WebAssembly bindings for verusid-cmm-encrypt."
repository = "https://github.com/vdappdev2/verusid-cmm-encrypt"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
# `#[wasm_bindgen]` expands to `unsafe extern` shims and `unsafe impl` marker
# traits; a `forbid(unsafe_code)` cannot be overridden by an `allow` inside
# macro output. So the lint is relaxed HERE and nowhere else in the workspace.
# The parent crate keeps `unsafe_code = "forbid"`; the property is preserved
# there where the actual cryptographic and framing logic lives. This sub-crate
# is a thin binding layer with no hand-written unsafe.
unsafe_code = "allow"
missing_docs = "warn"

[dependencies]
verusid-cmm-encrypt = { path = ".." }
wasm-bindgen = "0.2"
js-sys = "0.3"
# `getrandom` feature enables `rand_core::OsRng`. The RNG is constructed inside
# the binding so the JS caller does not need to source entropy.
rand_core = { version = "0.6", features = ["getrandom"] }

# On `wasm32-unknown-unknown` `getrandom` has no host OS to draw from and must
# be explicitly routed through the Web Crypto API (browser) or `node:crypto`
# (Node). Target-gated so a host `cargo test --lib` is untouched.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
